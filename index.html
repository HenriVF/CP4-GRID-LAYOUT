<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CP4 - Grid Layout & Responsividade</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <section class="hero-section">
    <div class="hero-container">

      <figure class="hero-image">
        <img src="images/banner/01.jpg"
          alt="Vista panorâmica da vila de Mykonos, com casas brancas na colina e um barco ancorado na baía">
      </figure>

      <div class="text-block">
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Nulla explicabo, quo, modi quod qui atque eaque
          repellendus est nisi voluptate facere.</p>
        <button class="btn-saiba-mais" type="button">Saiba mais</button>
      </div>

      <div class="mini-gallery">
        <figure>
          <img src="images/banner/04.jpg" alt="Rua estreita e branca de Mykonos com mesas de restaurante ao ar livre">
        </figure>
        <figure>
          <img src="images/banner/03.jpg" alt="Igreja de cúpula azul com vista para o mar em Mykonos">
        </figure>
        <figure>
          <img src="images/banner/02.jpg" alt="Varanda azul de casa grega com flores vermelhas de buganvília">
        </figure>
      </div>

    </div>
  </section>

  <section class="gallery-section">
    <div class="gallery-grid">
      <figure class="g-item"><img src="images/sea/01.jpg" alt="Rochas na praia com o mar ao fundo"></figure>
      <figure class="g-item g-tall"><img src="images/sea/03.jpg" alt="Água azul-turquesa cristalina da praia"></figure>
      <figure class="g-item"><img src="images/sea/01.jpg" alt="Praia rochosa vista de cima"></figure>
      <figure class="g-item g-tall"><img src="images/sea/03.jpg" alt="Praia de areia com pedras e vegetação"></figure>
      <figure class="g-item"><img src="images/sea/01.jpg" alt="Ondas suaves em praia de areia clara"></figure>
      <figure class="g-item"><img src="images/sea/02.jpg" alt="Ondas suaves em praia de areia clara"></figure>
      <figure class="g-item"><img src="images/sea/02.jpg" alt="Trilha de madeira entre dunas e mar"></figure>
      <figure class="g-item"><img src="images/sea/02.jpg" alt="Trilha de madeira entre dunas e mar"></figure>
    </div>
  </section>

</body>

</html>
